# GoReleaser configuration for tui-network.
#
# One repository, one binary, one tag series:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# CI runs `goreleaser release` on a v* tag and attaches static linux/amd64 and
# linux/arm64 archives to the GitHub release, each with its SBOM, plus a
# checksums.txt carrying a keyless cosign signature. Generated from the
# template in tui-kit/templates/.goreleaser.yaml.
version: 2

project_name: tui-network

before:
  hooks:
    - go mod download

builds:
  - id: tui-network
    main: ./cmd/tui-network
    binary: tui-network
    env:
      # Static binaries: no libc dependency, one file to copy anywhere.
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: tui-network
    ids:
      - tui-network
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - examples/config.toml

# The distribution packages. Three formats times two architectures is six
# files per release, and they are what pkgs.tui.tools indexes into the apt,
# dnf and pacman repositories: a tool is then installed and upgraded the way
# everything else on the machine is.
#
# GoReleaser cannot read tool.json, so `description` below is a copy of the
# manifest's tagline. tui-kit/tools/check-nfpm.py asserts the two are
# identical, and `make manifest` runs it, so the copy cannot drift.
nfpms:
  - id: tui-network
    ids:
      - tui-network
    package_name: tui-network
    formats:
      - deb
      - rpm
      - archlinux
    # Each ecosystem's own naming, so the files look native where they land:
    # tui-network_0.1.0_amd64.deb, tui-network-0.1.0.x86_64.rpm,
    # tui-network-0.1.0-1-x86_64.pkg.tar.zst.
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: tui-tools
    homepage: https://tui.tools/tools/tui-network/
    maintainer: tui-tools <maintainers@tui.tools>
    description: "Links, addresses, routes and DNS, with every change previewed before it runs"
    license: MIT
    # The binary belongs in the distribution's own path, not /usr/local: it
    # arrives through the package manager, so the package manager owns it.
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: README.md
        dst: /usr/share/doc/tui-network/README.md
      - src: LICENSE
        dst: /usr/share/doc/tui-network/LICENSE
      - src: examples/config.toml
        dst: /usr/share/doc/tui-network/config.toml
    # The package owns the binary name, so anything else shipping the same
    # command — an AUR -bin build, a hand-rolled local package — is a
    # conflict rather than a silent overwrite.
    provides:
      - tui-network
    conflicts:
      - tui-network-bin
    rpm:
      group: Applications/System
    archlinux:
      pkgbase: tui-network
      packager: tui-tools <maintainers@tui.tools>

checksum:
  name_template: checksums.txt

# One SBOM per archive, in CycloneDX JSON, generated by syft from the archive
# itself rather than from the source tree, so it describes what was actually
# shipped. The release job installs syft before calling GoReleaser.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.cyclonedx.json"
    cmd: syft
    args:
      - "$artifact"
      - --output
      - cyclonedx-json=$document

# Keyless signing: cosign gets its identity from the workflow's OIDC token,
# so there is no signing key to hold, rotate or leak, and the certificate
# names the workflow and the tag that produced the file.
#
# Only checksums.txt is signed. It already names every archive and every
# package with its digest, so one signature covers the whole release: verify
# the file, then `sha256sum -c` whatever you downloaded against it.
#
# The output is a Sigstore bundle — certificate, signature and transparency
# log entry in one file — which is what `cosign verify-blob --bundle` reads.
signs:
  - id: checksums
    cmd: cosign
    args:
      - sign-blob
      - --yes
      - --bundle
      - "${signature}"
      - "${artifact}"
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
