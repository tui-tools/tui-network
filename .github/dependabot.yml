# Shared Dependabot configuration for the tui-tools family.
#
# Copied from tui-template unchanged. The family pins nothing by hand, so this
# is what keeps a tool's dependencies and its CI actions current between
# releases.
#
# No commit-message prefix is set on purpose: Dependabot's default subject
# ("Bump x from a to b") already reads like the plain imperative sentences the
# rest of the history is written in, and a "chore(deps):" prefix would be the
# only conventional-commit line in the repository.
version: 2

updates:
  # Go modules. Minor and patch updates arrive as one weekly pull request, so
  # the routine bumps cost one review. A major is left on its own, because it
  # is an API change that deserves to be read.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # The workflow's own actions, grouped the same way.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
