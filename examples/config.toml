# tui-template configuration.
#
# Read from /etc/tui-template/config.toml first, then
# ~/.config/tui-template/config.toml, with the user file overriding the
# machine-wide one. TUI_TEMPLATE_* environment variables override both, and
# command line flags override everything.

# This tool's own key: the directory to list. Replace it with yours.
dir = "."

# Privilege escalation prefix used for actions; "" runs the command directly.
sudo = "sudo -n"

# Path to an Omarchy-style colors.toml. Empty follows the active Omarchy
# theme when present, and falls back to the built-in Tokyo Night palette.
theme = ""

# Every key can also be set in the environment, upper-cased and prefixed:
#   TUI_TEMPLATE_DIR=/srv
#   TUI_TEMPLATE_SUDO="doas"
