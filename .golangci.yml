# Shared golangci-lint configuration for the tui-tools family.
#
# Copy to .golangci.yml at the root of the tool's repository, unchanged: every
# tool in the family is held to the same bar, so a lint that passes here passes
# everywhere. Nothing is excluded wholesale — a finding that is deliberate gets
# a targeted //nolint on the line, with a comment saying why.
version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    # The tools run privileged commands on someone else's machine, so the
    # security linter is part of the bar rather than an occasional audit.
    # The one finding the family expects is G204 inside internal/<backend>/,
    # where an argv built from user input is the whole point; that line
    # carries a //nolint saying so.
    - gosec
    - ineffassign
    - staticcheck
    - unused

formatters:
  enable:
    - gofmt
